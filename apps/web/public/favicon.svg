<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26">
  <!-- The Gridwise mark. Same geometry as apps/web/src/features/shell/Logo.tsx,
       but with literal colours: a favicon renders outside the page, so there is
       no currentColor to inherit and no Tailwind class to apply. The media
       query flips the rules for dark browser chrome. -->
  <style>
    .rule { stroke: #525252; }
    @media (prefers-color-scheme: dark) { .rule { stroke: #a3a3a3; } }
  </style>
  <rect x="9" y="9" width="8" height="8" fill="#2563eb"/>
  <g class="rule" stroke-width="1.5" stroke-linecap="round" opacity="0.75">
    <line x1="1" y1="1" x2="25" y2="1"/>
    <line x1="1" y1="9" x2="25" y2="9"/>
    <line x1="1" y1="17" x2="25" y2="17"/>
    <line x1="1" y1="25" x2="25" y2="25"/>
    <line x1="1" y1="1" x2="1" y2="25"/>
    <line x1="9" y1="1" x2="9" y2="25"/>
    <line x1="17" y1="1" x2="17" y2="25"/>
    <line x1="25" y1="1" x2="25" y2="25"/>
  </g>
</svg>
